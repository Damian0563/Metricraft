name: Nuxt Build
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup code
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Change path
        run: cd frontend
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx nuxi typecheck
      - name: Build
        run: npm run build
      # - name: Test
      #   run: npm run test
