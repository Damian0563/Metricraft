name: Go
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install dependencies
      uses: actions/setup-go@v5
      with:
        go-version: ^1.23.x
    - name: Build
      run: cd worker && go build .
    - name: Test
      run: cd worker/enter && go test -v .
