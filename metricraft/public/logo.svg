<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F376" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F376" stop-opacity="0.0" />
    </linearGradient>
    <clipPath id="hexClip">
      <polygon points="100,55 160.6,90 160.6,160 100,195 39.4,160 39.4,90" />
    </clipPath>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03" />
    </pattern>
  </defs>
  <rect width="800" height="250" fill="#0A0E13" rx="20" />
  <rect width="800" height="250" fill="url(#grid)" rx="20" />
  <g transform="translate(60, 0)">
    <polygon points="100,55 160.6,90 160.6,160 100,195 39.4,160 39.4,90"
             fill="#0D131A" stroke="#1A2633" stroke-width="4" />
    <g clip-path="url(#hexClip)">
      <line x1="50" y1="150" x2="50" y2="250" stroke="#00F376" stroke-width="2" opacity="0.2" stroke-dasharray="4 4" />
      <line x1="75" y1="90" x2="75" y2="250" stroke="#00F376" stroke-width="2" opacity="0.2" stroke-dasharray="4 4" />
      <line x1="100" y1="125" x2="100" y2="250" stroke="#00F376" stroke-width="2" opacity="0.2" stroke-dasharray="4 4" />
      <line x1="125" y1="75" x2="125" y2="250" stroke="#00F376" stroke-width="2" opacity="0.2" stroke-dasharray="4 4" />
      <line x1="150" y1="110" x2="150" y2="250" stroke="#00F376" stroke-width="2" opacity="0.2" stroke-dasharray="4 4" />
      <path d="M 50 200 L 50 150 L 75 90 L 100 125 L 125 75 L 150 110 L 150 200 Z" fill="url(#chartGradient)" />
    </g>
    <path d="M 50 150 L 75 90 L 100 125 L 125 75 L 150 110"
          fill="none" stroke="#00F376" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#neonGlow)" />
    <circle cx="50" cy="150" r="5" fill="#0A0E13" stroke="#00F376" stroke-width="3" />
    <circle cx="75" cy="90" r="5" fill="#0A0E13" stroke="#00F376" stroke-width="3" />
    <circle cx="100" cy="125" r="5" fill="#0A0E13" stroke="#00F376" stroke-width="3" />
    <circle cx="125" cy="75" r="5" fill="#0A0E13" stroke="#00F376" stroke-width="3" />
    <circle cx="150" cy="110" r="5" fill="#0A0E13" stroke="#00F376" stroke-width="3" />
  </g>
  <g>
    <text x="260" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="82" letter-spacing="-1">
      <tspan fill="#FFFFFF" font-weight="500">Metric</tspan><tspan font-weight="900" fill="#00F376">raft</tspan>
    </text>
  </g>
</svg>
