[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=docker-entrypoint.sh postgres
priority=10
autorestart=true
startretries=10
; SIGINT = fast shutdown; the default SIGTERM waits for clients to disconnect and gets SIGKILLed by docker
stopsignal=INT
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --bind 127.0.0.1 --save "" --appendonly no
user=redis
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/usr/local/bin/backend
directory=/app
user=metricraft
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/worker
directory=/app
user=metricraft
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
; Nuxt reads runtimeConfig overrides from NUXT_* env vars, so map the shared SECRET at startup
command=/bin/sh -c 'export NUXT_SECRET="$SECRET" NUXT_PUBLIC_SECRET="$SECRET"; exec node /app/web/.output/server/index.mjs'
directory=/app/web
user=metricraft
environment=PORT="8000",HOST="0.0.0.0"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
