  #   image: damianek952/metricraft:latest
  #   environment:
  #     APPNAME: ${APPNAME:-my-app}
  #     DEST_PORT: ${DEST_PORT:-3000}
  #     NUXT_PUBLIC_HTTPHOST: ${METRICRAFT_PUBLIC_URL:-http://localhost:8080}
  #     NUXT_PUBLIC_WSSHOST: ${METRICRAFT_WS_URL:-ws://localhost:8080}
  #   ports:
  #     - 8000:8000
