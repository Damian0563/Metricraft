syntax = "proto3";
package metricraft;
option go_package = "metricraft/proto";
import "google/protobuf/duration.proto";

service Metricraft {

  rpc getUrlCongestion(timeframe) returns (congestion);
}

message timeframe{
  google.protobuf.Duration timeframe = 1;
}

message congestion{
  map<string,int32> congestion = 1;
}
